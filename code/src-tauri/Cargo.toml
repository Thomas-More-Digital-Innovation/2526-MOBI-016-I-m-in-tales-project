[package]
name = "whispertag"
version = "1.0.0"
description = "Interactive storytelling NFC player"
authors = ["Thomas More Digital Innovation"]
license = "MIT"
repository = "https://github.com/Thomas-More-Digital-Innovation/2526-MOBI-016-I-m-in-tales-project"
default-run = "whispertag"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
libloading = "0.8"
thiserror = "1.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
